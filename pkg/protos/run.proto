syntax = "proto3";

package martiancloud.tharsis.api.run;

option go_package = "gitlab.com/infor-cloud/martian-cloud/tharsis/tharsis-api/pkg/protos/gen";

import "metadata.proto";
import "pagination.proto";
import "plan.proto";
import "apply.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// Runs implements all functionality related to a Tharsis Run.
service Runs {
  // GetRunByID returns a Run by an ID.
  rpc GetRunByID(GetRunByIDRequest) returns (Run);
  // GetRuns returns a paginated list of Runs.
  rpc GetRuns(GetRunsRequest) returns (GetRunsResponse);
  // CreateRun creates a new Run.
  rpc CreateRun(CreateRunRequest) returns (Run);
  // ApplyRun applies a Run.
  rpc ApplyRun(ApplyRunRequest) returns (Run);
  // CancelRun cancels a Run.
  rpc CancelRun(CancelRunRequest) returns (Run);
  // GetRunVariables returns variables for a Run.
  rpc GetRunVariables(GetRunVariablesRequest) returns (GetRunVariablesResponse);
  // GetPlanByID returns a Plan by an ID.
  rpc GetPlanByID(plan.GetPlanByIDRequest) returns (plan.Plan);
  // GetApplyByID returns an Apply by an ID.
  rpc GetApplyByID(apply.GetApplyByIDRequest) returns (apply.Apply);
  // UpdatePlan updates a Plan.
  rpc UpdatePlan(plan.UpdatePlanRequest) returns (plan.Plan);
  // ReportRunPolicyOutcomes records the policy-set outcomes for a run's policy check node (at any
  // stage) and sets the check verdict.
  rpc ReportRunPolicyOutcomes(ReportRunPolicyOutcomesRequest) returns (google.protobuf.Empty);
  // UpdateApply updates an Apply.
  rpc UpdateApply(apply.UpdateApplyRequest) returns (apply.Apply);
  // SetVariablesIncludedInTFConfig updates which variables are included in the Terraform config.
  rpc SetVariablesIncludedInTFConfig(SetVariablesIncludedInTFConfigRequest) returns (google.protobuf.Empty);
  // SubscribeToRunEvents subscribes to run events.
  rpc SubscribeToRunEvents(SubscribeToRunEventsRequest) returns (stream RunEvent);
  // CreateDestroyRunForWorkspace creates a destroy run using the workspace's current state.
  rpc CreateDestroyRunForWorkspace(CreateDestroyRunForWorkspaceRequest) returns (Run);
}

// RunSortableField defines enums that allow sorting a paginated list of Runs.
enum RunSortableField {
  CREATED_AT_ASC  = 0;
  CREATED_AT_DESC = 1;
  UPDATED_AT_ASC  = 2;
  UPDATED_AT_DESC = 3;
}

// RunStatus defines the status of a Run.
enum RunStatus {
  UNSPECIFIED          = 0;
  PENDING              = 1;
  PLAN_QUEUED          = 2;
  PLANNING             = 3;
  PLANNED              = 4;
  PLANNED_AND_FINISHED = 5;
  PLAN_QUEUING         = 6;
  APPLY_QUEUING        = 7;
  APPLY_QUEUED         = 8;
  APPLYING             = 9;
  APPLIED              = 10;
  CANCELED             = 11;
  DISCARDED            = 12;
  ERRORED              = 13;
  PRE_PLAN_QUEUING              = 14;
  PRE_PLAN_RUNNING              = 15;
  PRE_PLAN_AWAITING_DECISION    = 16;
  PRE_PLAN_COMPLETED            = 17;
  POST_PLAN_RUNNING             = 18;
  POST_PLAN_AWAITING_DECISION   = 19;
  PRE_APPLY_QUEUING             = 20;
  PRE_APPLY_RUNNING             = 21;
  PRE_APPLY_AWAITING_DECISION   = 22;
  PRE_APPLY_COMPLETED           = 23;
  POST_APPLY_RUNNING            = 24;
}

// PolicyCheckType identifies the policy engine a check runs.
enum PolicyCheckType {
  POLICY_CHECK_TYPE_UNSPECIFIED = 0;
  POLICY_CHECK_TYPE_OPA         = 1;
  POLICY_CHECK_TYPE_MODULE_ATTESTATION = 2;
}

// RunTaskStageName identifies which stage of a run a policy check evaluates at.
enum RunTaskStageName {
  RUN_TASK_STAGE_NAME_UNSPECIFIED = 0;
  RUN_TASK_STAGE_NAME_PRE_PLAN    = 1;
  RUN_TASK_STAGE_NAME_POST_PLAN   = 2;
  RUN_TASK_STAGE_NAME_PRE_APPLY   = 3;
  RUN_TASK_STAGE_NAME_POST_APPLY  = 4;
}

// RunTaskStageStatus represents the aggregate status of a task stage node.
enum RunTaskStageStatus {
  RUN_TASK_STAGE_STATUS_UNSPECIFIED       = 0;
  RUN_TASK_STAGE_STATUS_CREATED           = 1;
  RUN_TASK_STAGE_STATUS_RUNNING           = 2;
  RUN_TASK_STAGE_STATUS_AWAITING_OVERRIDE = 3;
  RUN_TASK_STAGE_STATUS_COMPLETED         = 4;
  RUN_TASK_STAGE_STATUS_ERRORED           = 5;
  RUN_TASK_STAGE_STATUS_CANCELED          = 6;
  RUN_TASK_STAGE_STATUS_SKIPPED           = 7;
  // Ready, but still waiting for the workspace slot. Only the workspace-gated stages
  // (pre_plan, pre_apply) reach this.
  RUN_TASK_STAGE_STATUS_PENDING           = 8;
}

// PolicyCheckStatus represents the status of a policy check node.
enum PolicyCheckStatus {
  POLICY_CHECK_STATUS_UNSPECIFIED       = 0;
  POLICY_CHECK_STATUS_CREATED           = 1;
  POLICY_CHECK_STATUS_QUEUED            = 2;
  POLICY_CHECK_STATUS_RUNNING           = 3;
  POLICY_CHECK_STATUS_PASSED            = 4;
  POLICY_CHECK_STATUS_SOFT_FAILED = 5;
  POLICY_CHECK_STATUS_OVERRIDDEN        = 6;
  POLICY_CHECK_STATUS_ERRORED           = 7;
  POLICY_CHECK_STATUS_CANCELED          = 8;
  POLICY_CHECK_STATUS_SKIPPED           = 9;
  POLICY_CHECK_STATUS_PENDING           = 10;
}

// PolicyCheckPolicyStatus is the pass/fail result the evaluator reported for a single policy.
enum PolicyCheckPolicyStatus {
  POLICY_CHECK_POLICY_STATUS_UNSPECIFIED = 0;
  POLICY_CHECK_POLICY_STATUS_PASSED      = 1;
  POLICY_CHECK_POLICY_STATUS_FAILED      = 2;
  POLICY_CHECK_POLICY_STATUS_PENDING     = 3;
}

// PolicyEnforcementLevel controls how a policy failure affects a run.
enum PolicyEnforcementLevel {
  POLICY_ENFORCEMENT_LEVEL_UNSPECIFIED    = 0;
  POLICY_ENFORCEMENT_LEVEL_ADVISORY       = 1;
  POLICY_ENFORCEMENT_LEVEL_SOFT_MANDATORY = 2;
  POLICY_ENFORCEMENT_LEVEL_HARD_MANDATORY = 3;
}

// GetRunByIDRequest is the input for retrieving a Run by its ID.
message GetRunByIDRequest {
  string id = 1;
}

// GetRunsRequest is the input for retrieving a paginated list of Runs.
message GetRunsRequest {
  optional pagination.PaginationOptions pagination_options  = 1;
  optional RunSortableField             sort                = 2;
  optional string                       workspace_id        = 3;
  optional string                       group_id            = 4;
  optional bool                         include_nested_runs = 5;
}

// CreateRunRequest is the input for creating a new Run.
message CreateRunRequest {
  string                    workspace_id             = 1;
  optional string           configuration_version_id = 2;
  bool                      is_destroy               = 3;
  optional string           terraform_version        = 4;
  optional bool             speculative              = 5;
  repeated string           target_addresses         = 6;
  optional bool             refresh                  = 7;
  bool                      refresh_only             = 8;
  repeated RunVariableInput variables                = 9;
  optional string           module_source            = 10;
  optional string           module_version           = 11;
  // When true and module_version is unset or a constraint range, prerelease
  // module versions are eligible to be selected as "latest". Defaults to
  // false. Has no effect when module_version is an exact match. Requires
  // module_source to be set.
  optional bool include_module_prereleases = 12;
  // When true, the run's apply phase is started automatically once the plan
  // finishes with changes, instead of waiting for a manual apply. Defaults to
  // false when unset.
  optional bool auto_apply = 13;
}

// ApplyRunRequest is the input for applying a Run.
message ApplyRunRequest {
  string run_id = 1;
}

// CancelRunRequest is the input for canceling a Run.
message CancelRunRequest {
  string        id    = 1;
  optional bool force = 2;
}

// CreateDestroyRunForWorkspaceRequest is the input for creating a destroy run for a workspace.
message CreateDestroyRunForWorkspaceRequest {
  string workspace_id = 1;
}

// GetRunVariablesRequest is the input for getting run variables.
message GetRunVariablesRequest {
  string id                       = 1;
  bool   include_sensitive_values = 2;
}

// SubscribeToRunEventsRequest is the input for subscribing to run events.
message SubscribeToRunEventsRequest {
  optional string workspace_id      = 1;
  optional string run_id            = 2;
  optional string ancestor_group_id = 3;
}

// RunVariableInput is the input for a run variable.
message RunVariableInput {
  string          category = 1;
  string          key      = 2;
  optional string value    = 3;
}

// SetVariablesIncludedInTFConfigRequest is the input for setting variables included in the Terraform config.
message SetVariablesIncludedInTFConfigRequest {
  string          run_id        = 1;
  repeated string variable_keys = 2;
}


// Run represents a Terraform plan/apply operation.
message Run {
  metadata.ResourceMetadata metadata                           = 1;
  string                    apply_id                           = 2;
  optional string           configuration_version_id           = 3;
  string                    created_by                         = 4;
  bool                      force_canceled                     = 5;
  optional google.protobuf.Timestamp force_cancel_available_at = 6;
  optional string                    force_canceled_by         = 7;
  bool                               has_changes               = 8;
  bool                               is_destroy                = 9;
  optional string                    module_digest             = 10;
  optional string                    module_source             = 11;
  optional string                    module_version            = 12;
  string                             plan_id                   = 13;
  bool                               refresh                   = 14;
  bool                               refresh_only              = 15;
  string                             deprecated_status         = 16 [deprecated = true];
  repeated string                    target_addresses          = 17;
  string                             terraform_version         = 18;
  string                             workspace_id              = 19;
  bool                               speculative               = 20;
  bool                               auto_apply                = 21;
  plan.Plan                          plan                      = 22;
  // Not set for speculative runs, which have no apply stage.
  optional apply.Apply               apply                     = 23;
  RunStatus                          status                    = 24;
  repeated RunTaskStage              task_stages               = 25;
  bool                               is_assessment_run         = 26;
}

// RunTaskStage is a stage of a run (pre_plan, post_plan, ...), mirroring the run model's
// RunTaskStage. It owns the policy checks evaluated at that stage; its status is their aggregate
// verdict.
message RunTaskStage {
  string               id            = 1;
  RunTaskStageName     stage_name    = 2;
  RunTaskStageStatus   status        = 3;
  repeated PolicyCheck policy_checks = 4;
}

// PolicyCheck is a policy-evaluation node of a run, mirroring the run model's PolicyCheck. It owns
// the per-policy-set policies it evaluates (with their results) and the check verdict.
message PolicyCheck {
  string            id            = 1;
  PolicyCheckType   check_type    = 2;
  PolicyCheckStatus status        = 3;
  optional string   latest_job_id = 4;
  repeated PolicyCheckPolicy policies      = 5;
  RunTaskStageName           stage_name    = 6;
}

// OPAPolicyCheckData is the OPA-specific snapshot of a policy a check evaluates.
// package_version_constraint is resolved to a concrete package version by the evaluator when the
// check runs — an empty constraint means the latest uploaded version. package_digest, when set, is
// the hex sha256 the package must match.
message OPAPolicyCheckData {
  string package_source = 1;
  string package_version_constraint = 2;
  optional string package_digest = 3;
}

// ModuleAttestationPolicyCheckData is the module-attestation snapshot of a policy a check evaluates.
// These checks are evaluated in the API rather than by a runner, so this is carried for completeness.
message ModuleAttestationPolicyCheckData {
  string public_key = 1;
  optional string predicate_type = 2;
  bool verify_state_lineage = 3;
}

// PolicyCheckPolicy is one policy attachment a check evaluates, with its result. There is one entry
// per valid attachment (no de-duplication); id is the stable per-attachment identity the evaluator
// echoes when reporting outcomes. Exactly one of opa_data and module_attestation_data is set,
// determined by the owning check's type. status is empty until the check is evaluated.
//
// The violation messages a previous evaluation reported are deliberately absent: the runner never
// read them, and they are held in object storage, so carrying them here would cost a fetch per
// policy on every run sent to a runner.
message PolicyCheckPolicy {
  string id             = 1;
  PolicyEnforcementLevel enforcement_level = 2;
  PolicyCheckPolicyStatus status           = 3;
  PolicyCheckPolicyProvenance provenance = 4;
  optional OPAPolicyCheckData opa_data = 5;
  optional ModuleAttestationPolicyCheckData module_attestation_data = 6;
}

// PolicyCheckPolicyProvenance records the group that owns a policy attachment and the stable TRN
// of the attachment itself. Policies are always group-scoped.
message PolicyCheckPolicyProvenance {
  string group_id   = 1;
  string policy_trn = 2;
}

// RunPolicyOutcomeInput is a single policy's outcome reported by the policy evaluator, keyed by the
// PolicyCheckPolicy id it received. The enforcement level is taken server-side from the pinned
// policy, not supplied here. messages holds one entry per violation the policy reported, in the
// order it should be displayed; the server bounds how much of it is kept.
message RunPolicyOutcomeInput {
  string policy_id = 1;
  bool   passed    = 2;
  repeated string messages = 3;
}

// ReportRunPolicyOutcomesRequest reports the per-policy-set outcomes for a run's policy check
// node, identified by its RunNode GID
message ReportRunPolicyOutcomesRequest {
  string                     policy_check_id = 1;
  repeated RunPolicyOutcomeInput outcomes        = 2;
}

// RunVariable represents a variable used in a run.
message RunVariable {
  optional string namespace_path        = 1;
  string          category              = 2;
  string          key                   = 3;
  optional string value                 = 4;
  bool            sensitive             = 5;
  optional string version_id            = 6;
  bool            included_in_tf_config = 7;
}

// RunEvent represents a run event for subscriptions.
message RunEvent {
  string action = 1;
  Run    run    = 2;
}

// GetRunsResponse is the paginated list of Runs.
message GetRunsResponse {
  repeated Run        runs      = 1;
  pagination.PageInfo page_info = 2;
}

// GetRunVariablesResponse is the response for getting run variables.
message GetRunVariablesResponse {
  repeated RunVariable variables = 1;
}
