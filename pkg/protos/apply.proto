syntax = "proto3";

package martiancloud.tharsis.api.apply;

option go_package = "gitlab.com/infor-cloud/martian-cloud/tharsis/tharsis-api/pkg/protos/gen";

import "actor.proto";
import "metadata.proto";

// ApplyStatus defines the status of an Apply.
enum ApplyStatus {
  UNSPECIFIED = 0;
  CREATED     = 1;
  PENDING     = 2;
  QUEUED      = 3;
  RUNNING     = 4;
  FINISHED    = 5;
  ERRORED     = 6;
  CANCELED    = 7;
  SKIPPED     = 8;
}

// GetApplyByIDRequest is the input for retrieving an Apply by its ID.
message GetApplyByIDRequest {
  string id = 1;
}

// UpdateApplyRequest is the input for updating an Apply.
message UpdateApplyRequest {
  string          id            = 1;
  optional int64  version       = 2;
  // Field number 3 was used for the status field which has been removed
  reserved 3;
  optional string error_message = 4;
}

// Apply represents a Terraform apply.
message Apply {
  metadata.ResourceMetadata metadata          = 1;
  string                    deprecated_status = 2 [deprecated = true];
  // triggered_by is the free-form identifier of the principal that triggered the
  // apply. Deprecated in favour of triggered_by_actor.
  string                    triggered_by      = 3 [deprecated = true];
  optional string           error_message     = 4;
  optional string           latest_job_id     = 5;
  ApplyStatus               status            = 6;
  // Global IDs of the managed identities the apply job may create credentials for. Set when
  // auto-apply is enabled (including at run creation) or when the apply is approved; empty
  // otherwise.
  repeated string           managed_identity_ids = 7;
  // triggered_by_actor is the structured identity of the principal that
  // triggered the apply. Absent for applies triggered before actors were
  // introduced.
  actor.Actor               triggered_by_actor = 8;
}
