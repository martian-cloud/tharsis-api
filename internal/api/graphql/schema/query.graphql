type PageInfo {
  endCursor: String
  startCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

union MeResponse = User | ServiceAccount

# The Query type represents all of the entry points into the API.
type Query {
  search(query: String!): SearchResponse!
  me: MeResponse
  userPreferences: UserPreferences!
  config: Config!
  node(id: String!): Node
  namespace(fullPath: String!): Namespace
  group(fullPath: String!): Group
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  groups(
    after: String
    before: String
    first: Int
    last: Int
    parentId: String
    parentPath: String
      @deprecated(
        reason: "Use parentId instead, which accepts a TRN (Tharsis Resource Name)"
      )
    search: String
    sort: GroupSort
    favorites: Boolean
  ): GroupConnection!
  workspace(fullPath: String!): Workspace
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  workspaces(
    after: String
    before: String
    first: Int
    last: Int
    groupId: String
    groupPath: String
      @deprecated(
        reason: "Use groupId instead, which accepts a TRN (Tharsis Resource Name)"
      )
    search: String
    sort: WorkspaceSort
    labelFilter: WorkspaceLabelsFilter
    favorites: Boolean
  ): WorkspaceConnection!
  terraformProviders(
    after: String
    before: String
    first: Int
    last: Int
    search: String
    sort: TerraformProviderSort
  ): TerraformProviderConnection!
  terraformProvider(
    registryNamespace: String!
    providerName: String!
  ): TerraformProvider
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  terraformProviderVersion(
    registryNamespace: String!
    providerName: String!
    version: String
  ): TerraformProviderVersion
  terraformModules(
    after: String
    before: String
    first: Int
    last: Int
    search: String
    sort: TerraformModuleSort
    labelFilter: TerraformModuleLabelsFilter
  ): TerraformModuleConnection!
  terraformModule(
    registryNamespace: String!
    moduleName: String!
    system: String!
  ): TerraformModule
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  terraformModuleVersion(
    registryNamespace: String!
    moduleName: String!
    system: String!
    version: String
  ): TerraformModuleVersion
  packages(
    after: String
    before: String
    first: Int
    last: Int
    search: String
    sort: PackageSort
  ): PackageConnection!
  run(id: String!): Run
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  """
  runNode returns a single node of a run, addressed by the run-relative nodePath: "plan", "apply", a
  task stage ("post_plan") or a policy check within one ("post_plan.opa"). Null when the run has no
  node at that path. runId accepts a TRN or a global ID and gates the lookup on the workspace's view
  permission, as the run query does.

  Nodes are reachable through the run itself, but only through list fields; this addresses one node
  directly, which is what a client paginating a node's jobs connection needs. It is the read
  counterpart of the nodePath the retryRunNode mutation takes.
  """
  runNode(runId: String!, nodePath: String!): RunNode
  runs(
    after: String
    before: String
    first: Int
    last: Int
    workspacePath: String
      @deprecated(
        reason: "Use workspaceId instead, which accepts a TRN (Tharsis Resource Name)"
      )
    workspaceId: String
    sort: RunSort
    workspaceAssessment: Boolean
  ): RunConnection!
  """
  runGatesAwaitingMyDecision returns the caller's approvals inbox: pending run gates the caller is
  an eligible approver for and has not yet decided. Because one gate is created per policy check,
  each qualifying run surfaces a single gate. Both user and service-account callers are supported.
  """
  runGatesAwaitingMyDecision(
    after: String
    before: String
    first: Int
    last: Int
    sort: RunGateSort
  ): RunGateConnection!
  namespaceVariableVersion(
    id: String!
    includeSensitiveValue: Boolean
  ): NamespaceVariableVersion
  job(id: String!): Job
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  jobs(
    after: String
    before: String
    first: Int
    last: Int
    workspaceId: String
    workspacePath: String
      @deprecated(
        reason: "Use workspaceId instead, which accepts a TRN (Tharsis Resource Name)"
      )
    jobType: JobType
    jobStatus: JobStatus
    sort: JobSort
  ): JobConnection!
  managedIdentity(id: String, path: String): ManagedIdentity
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  serviceAccount(id: String!): ServiceAccount
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  users(
    after: String
    before: String
    first: Int
    last: Int
    search: String
    sort: UserSort
  ): UserConnection!
  configurationVersion(id: String!): ConfigurationVersion
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  team(name: String!): Team
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  teams(
    after: String
    before: String
    first: Int
    last: Int
    search: String
    sort: TeamSort
  ): TeamConnection!
  terraformCLIVersions: TerraformCLIVersions
  sharedRunners(
    after: String
    before: String
    first: Int
    last: Int
    sort: ServiceAccountSort
  ): RunnerConnection!
  # There is no query for an activity event by ID.
  activityEvents(
    after: String
    before: String
    first: Int
    last: Int
    userId: String
    serviceAccountId: String
    username: String
      @deprecated(
        reason: "Use userId instead, which accepts a TRN (Tharsis Resource Name)"
      )
    serviceAccountPath: String
      @deprecated(
        reason: "Use serviceAccountId instead, which accepts a TRN (Tharsis Resource Name)"
      )
    namespacePath: String
    includeNested: Boolean
    timeRangeStart: Time
    timeRangeEnd: Time
    actions: [ActivityEventAction!]
    targetTypes: [ActivityEventTargetType!]
    sort: ActivityEventSort
  ): ActivityEventConnection!
  role(name: String!): Role
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  roles(
    after: String
    before: String
    first: Int
    last: Int
    search: String
    sort: RoleSort
  ): RoleConnection!
  availableRolePermissions: [String!]!
  authSettings: AuthSettings
  resourceLimits: [ResourceLimit!]!
  terraformProviderVersionMirror(
    registryNamespace: String!
    registryHostname: String!
    type: String!
    version: String!
    groupPath: String!
  ): TerraformProviderVersionMirror
    @deprecated(
      reason: "Use node query instead, which accepts a TRN (Tharsis Resource Name)"
    )
  maintenanceMode: MaintenanceMode
  announcements(
    after: String
    before: String
    first: Int
    last: Int
    sort: AnnouncementSort
    active: Boolean
  ): AnnouncementConnection!
  version: Version!
  agentTrace(input: AgentTraceInput!): String
  adminLogTail(
    limit: Int
    levels: [AdminLogTailLevel!]
    search: String
  ): [AdminLogTailEntry!]!
}
