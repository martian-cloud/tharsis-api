enum TerraformProviderVersionDocsProcessingStatus {
  NOT_STARTED
  PENDING
  COMPLETED
  FAILED
}

enum TerraformProviderDocItemCategory {
  OVERVIEW
  RESOURCES
  DATA_SOURCES
  EPHEMERAL_RESOURCES
  FUNCTIONS
  GUIDES
}

enum TerraformProviderVersionSort {
  CREATED_AT_ASC
  CREATED_AT_DESC
  UPDATED_AT_ASC
  UPDATED_AT_DESC
  VERSION_ASC
  VERSION_DESC
}

type TerraformProviderVersionConnection {
  totalCount: Int!
  pageInfo: PageInfo!
  edges: [TerraformProviderVersionEdge]
}

type TerraformProviderVersionEdge {
  cursor: String!
  node: TerraformProviderVersion
}

type CreateTerraformProviderVersionPayload {
  clientMutationId: String
  providerVersion: TerraformProviderVersion
  problems: [Problem!]!
}

type DeleteTerraformProviderVersionPayload {
  clientMutationId: String
  providerVersion: TerraformProviderVersion
  problems: [Problem!]!
}

type TerraformProviderVersion implements Node {
  id: ID!
  metadata: ResourceMetadata!
  provider: TerraformProvider!
  version: String!
  gpgKeyId: String
  gpgAsciiArmor: String
  protocols: [String!]!
  shaSumsUploaded: Boolean!
  shaSumsSigUploaded: Boolean!
  readmeUploaded: Boolean!
  readme: String! @complexity(value: 1)
  docs: TerraformProviderVersionDocs! @complexity(value: 5)
  platforms: [TerraformProviderPlatform!]!
  latest: Boolean!
  createdBy: String! @deprecated(reason: "Use createdByActor instead.")
  createdByActor: Actor @complexity(value: 0)
}

"""
TerraformProviderVersionDocs groups a provider version's documentation: the upload/processing
status, any processing error, the catalog of doc items, and the content of an individual doc item.
"""
type TerraformProviderVersionDocs {
  processingStatus: TerraformProviderVersionDocsProcessingStatus!
  processingErrorMessage: String
  items: [TerraformProviderDocItem!]!
  fileData(category: TerraformProviderDocItemCategory!, filename: String!): String @complexity(value: 5)
}

type TerraformProviderDocItem {
  filename: String!
  category: TerraformProviderDocItemCategory!
  subcategory: String
}

input CreateTerraformProviderVersionInput {
  clientMutationId: String
  providerPath: String
    @deprecated(
      reason: "Use providerId field instead, which accepts a TRN (Tharsis Resource Name)"
    )
  providerId: String
  version: String!
  protocols: [String!]!
}

input DeleteTerraformProviderVersionInput {
  clientMutationId: String
  id: ID!
  metadata: ResourceMetadataInput
}
