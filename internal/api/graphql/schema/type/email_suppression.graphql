enum EmailSuppressionSort {
  CREATED_AT_ASC
  CREATED_AT_DESC
}

enum EmailSuppressionCause {
  HARD_BOUNCE
  COMPLAINT
}

type EmailSuppression implements Node {
  id: ID!
  metadata: ResourceMetadata!
  address: String!
  cause: EmailSuppressionCause!
}

type EmailSuppressionConnection {
  totalCount: Int!
  pageInfo: PageInfo!
  edges: [EmailSuppressionEdge]
}

type EmailSuppressionEdge {
  cursor: String!
  node: EmailSuppression
}

type DeleteEmailSuppressionPayload {
  clientMutationId: String
  suppression: EmailSuppression
  problems: [Problem!]!
}

input DeleteEmailSuppressionInput {
  clientMutationId: String
  id: ID!
  metadata: ResourceMetadataInput
}
