enum ApplyStatus {
  canceled
  created
  errored
  finished
  pending
  queued
  running
  skipped
}

type Apply {
  id: ID!
  metadata: ResourceMetadata! @deprecated(
      reason: "use run metadata instead"
  )
  status: ApplyStatus!
  currentJob: Job
  jobs(
    after: String
    before: String
    first: Int
    last: Int
    sort: JobSort
  ): JobConnection!
  triggeredBy: String @deprecated(reason: "Use triggeredByActor instead.")
  triggeredByActor: Actor @complexity(value: 0)
  comment: String!
  errorMessage: String
}
