type EnableMaintenanceModePayload {
  clientMutationId: String
  maintenanceMode: MaintenanceMode
  problems: [Problem!]!
}

type DisableMaintenanceModePayload {
  clientMutationId: String
  maintenanceMode: MaintenanceMode
  problems: [Problem!]!
}

type MaintenanceMode {
  id: ID!
  metadata: ResourceMetadata!
  createdBy: String! @deprecated(reason: "Use createdByActor instead.")
  createdByActor: Actor @complexity(value: 0)
}

input EnableMaintenanceModeInput {
  clientMutationId: String
}

input DisableMaintenanceModeInput {
  clientMutationId: String
}
