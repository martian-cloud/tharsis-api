type SCIMToken implements Node {
  id: ID!
  metadata: ResourceMetadata!
  createdBy: String! @deprecated(reason: "Use createdByActor instead.")
  createdByActor: Actor @complexity(value: 0)
  """
  The time the token expires, null if it never expires.
  """
  expiresAt: Time
}

type CreateSCIMTokenPayload {
  clientMutationId: String
  tokenText: String
  scimToken: SCIMToken
  problems: [Problem!]!
}

input CreateSCIMTokenInput {
  clientMutationId: String
  idpIssuerURL: String!
  expiresAt: Time
}
